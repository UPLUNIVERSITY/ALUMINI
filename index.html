<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UPL Alumni Registration</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body class="bg-gray-100 p-6">

<form class="max-w-md mx-auto bg-white p-6 rounded"
onsubmit="startPayment(event)">

<input id="name" placeholder="Name" required class="border p-2 w-full mb-2">
<input id="email" placeholder="Email" required class="border p-2 w-full mb-2">
<input id="mobile" placeholder="Mobile" required class="border p-2 w-full mb-2">
<input id="year" placeholder="Year" required class="border p-2 w-full mb-2">
<input id="discipline" placeholder="Discipline" required class="border p-2 w-full mb-2">
<input id="department" placeholder="Department" required class="border p-2 w-full mb-2">

<select id="guests" class="border p-2 w-full mb-4">
  <option value="0">0 Guest</option>
  <option value="1">1 Guest</option>
  <option value="2">2 Guests</option>
</select>

<button id="payBtn" class="bg-purple-600 text-white w-full py-2">
Pay ₹100
</button>

</form>

<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbyMavFT5CxKBRETiGc4BOflwOrLLxVq0AP08hO8OEvbncJ3rYq2420LvyELKSIORoxmww/exec";
const AMOUNT = 100;

async function startPayment(e) {
  e.preventDefault();
  payBtn.disabled = true;

  const res = await fetch(BACKEND, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "create_payment",
      amount: AMOUNT
    })
  });

  const data = await res.json();

  if (!data.orderId) {
    alert("Payment init failed");
    payBtn.disabled = false;
    return;
  }

  const rzp = new Razorpay({
    key: data.key,
    amount: AMOUNT * 100,
    currency: "INR",
    order_id: data.orderId,
    handler: async function (resp) {

      await fetch(BACKEND, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "payment_success",
          orderId: data.orderId,
          paymentId: resp.razorpay_payment_id,
          amount: AMOUNT,
          name: name.value,
          email: email.value,
          mobile: mobile.value,
          year: year.value,
          discipline: discipline.value,
          department: department.value,
          guests: guests.value
        })
      });

      alert("Payment successful!");
      location.reload();
    }
  });

  rzp.open();
  payBtn.disabled = false;
}
</script>

</body>
</html>
