<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UPL Alumni Registration</title>
<link rel="icon" href="data:,">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body class="bg-gray-100 p-6">

<form id="f" class="max-w-xl mx-auto bg-white p-6 rounded"
 onsubmit="pay(event)">

<input id="name" placeholder="Name" required class="border p-2 w-full mb-2">
<input id="email" placeholder="Email" required class="border p-2 w-full mb-2">
<input id="mobile" placeholder="Mobile" required class="border p-2 w-full mb-2">
<input id="year" placeholder="Year" required class="border p-2 w-full mb-2">
<input id="discipline" placeholder="Discipline" required class="border p-2 w-full mb-2">
<input id="department" placeholder="Department" required class="border p-2 w-full mb-2">

<select id="guests" class="border p-2 w-full mb-4">
<option value="0">0 Guest</option>
<option value="1">1 Guest</option>
<option value="2">2 Guests</option>
</select>

<button id="btn" class="bg-purple-600 text-white w-full py-2">
Pay ₹100
</button>

</form>

<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbwBKJXUtl0mBE5pw0PIIPsy4uySxquwpm6_LXRTks2gjchGb-RySdco6Yhxnz8k85Gblg/exec";
const AMOUNT = 100;

async function pay(e) {
  e.preventDefault();
  btn.disabled = true;

  const r = await fetch(BACKEND, {
    method: "POST",
    headers: { "Content-Type":"application/json" },
    body: JSON.stringify({
      action:"create_payment",
      amount: AMOUNT
    })
  });

  const o = await r.json();

  if (!o.orderId) {
    alert("Order failed");
    btn.disabled = false;
    return;
  }

  const rp = new Razorpay({
    key: o.key,
    amount: AMOUNT * 100,
    currency: "INR",
    order_id: o.orderId,
    handler: async function (res) {

      await fetch(BACKEND, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          action:"payment_success",
          orderId:o.orderId,
          paymentId:res.razorpay_payment_id,
          amount:AMOUNT,
          name:name.value,
          email:email.value,
          mobile:mobile.value,
          year:year.value,
          discipline:discipline.value,
          department:department.value,
          guests:guests.value
        })
      });

      alert("Payment successful");
      location.reload();
    }
  });

  rp.open();
  btn.disabled = false;
}
</script>
</body>
</html>
