<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UPL Alumni Meet – Test Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body { font-family: system-ui; background:#020617; color:white; padding:20px; display:flex; justify-content:center; }
    .card { max-width:500px; width:100%; background:#0f172a; border:1px solid #1e293b; padding:20px; border-radius:14px; }
    input, select { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:white; }
    button { width:100%; background:#16a34a; padding:12px; color:#022c22; border:none; border-radius:50px; font-weight:600; margin-top:15px; cursor:pointer; }
  </style>
</head>

<body>
  <div class="card">
    <h2>UPL Alumni Meet 2026 – Test Payment Form</h2>

    <form id="regForm">
      <input id="name" name="name" type="text" placeholder="Full Name" required />
      <input id="email" name="email" type="email" placeholder="Email" required />
      <input id="phone" name="phone" type="text" placeholder="Phone" required />
      <select id="persons" name="persons" required>
        <option value="">Select Persons</option>
        <option value="1">1 Person</option>
        <option value="2">2 Persons</option>
        <option value="3">3 Persons</option>
      </select>
      <input type="hidden" id="amount" name="amount" value="0" />
      <button type="submit">Submit & Pay (TEST MODE)</button>
    </form>
  </div>

<script>
const PRICE = 100;

// 🔗 REPLACE THIS WITH YOUR APPS SCRIPT DEPLOYMENT URL
const CREATE_PAYMENT_URL =
  "https://script.google.com/macros/s/AKfycbxfTwLvslZMpdISEFMHvlSjbm6ZPy4rjX-kw-Rvv9Ggi4vdBT9j9WNnTiMUl2HvfhGjpA/exec";

document.getElementById("persons").addEventListener("change", () => {
  const p = Number(document.getElementById("persons").value || 0);
  document.getElementById("amount").value = p * PRICE;
});

document.getElementById("regForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const fd = new FormData(document.getElementById("regForm"));
  const res = await fetch(CREATE_PAYMENT_URL, { method: "POST", body: fd });
  const data = await res.json();

  if (data.success) {
    window.location.href = data.paymentUrl;  // Redirect to PhonePe mock
  } else {
    alert("Error creating test payment.");
  }
});
</script>
</body>
</html>
