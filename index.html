<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPL University Alumni Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

   <style>
        body { 
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)),
                        url('https://i.ibb.co/q3G5k42g/Slider-133972189776778304.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.98); 
            border-radius: 16px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        .razorpay-btn { background-color: #3399cc; transition: all 0.3s ease; }
        .razorpay-btn:hover { background-color: #267ba5; transform: translateY(-2px); }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3399cc;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="glass-card w-full max-w-5xl flex flex-col lg:flex-row overflow-hidden">

    <!-- LEFT PANEL -->
    <div class="w-full lg:w-4/12 bg-slate-900 text-white p-8 flex flex-col justify-between">
        <div>
            <img src="https://i.ibb.co/2Yhfrk8H/UPL-LOGO.png" class="h-16 mb-6">
            <h3 class="text-xs font-bold tracking-widest uppercase text-blue-400">UPL University</h3>
            <h1 class="text-3xl font-bold mb-4">Alumni Meet 2025</h1>
            <p class="text-slate-300 text-sm">Your presence truly matters to us.</p>
        </div>

        <div class="space-y-4 text-sm mt-8">
            <div class="flex items-center gap-3">
                <i class="far fa-calendar-alt text-blue-400"></i>
                <span>Jan 4, 2025 (Sunday)</span>
            </div>
            <div class="flex items-center gap-3">
                <i class="far fa-clock text-blue-400"></i>
                <span>3:00 PM – 7:00 PM</span>
            </div>
            <div class="flex items-center gap-3">
                <i class="fas fa-map-marker-alt text-blue-400"></i>
                <span>UPL University Campus</span>
            </div>
        </div>

        <p class="text-xs text-slate-500 mt-8">Secured by Razorpay</p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="w-full lg:w-8/12 p-8 lg:p-10">
        <h2 class="text-2xl font-bold mb-6 border-b pb-2">Registration Details</h2>

        <form id="regForm" onsubmit="initiateRazorpay(event)">

            <!-- NAME + YEAR -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                <div>
                    <label class="text-xs font-bold uppercase">Full Name</label>
                    <input id="name" required class="w-full border px-4 py-2 rounded-lg">
                </div>
                <div>
                    <label class="text-xs font-bold uppercase">Passout Year</label>
                    <select id="year" required class="w-full border px-4 py-2 rounded-lg">
                        <option value="">Select Year</option>
                        <script>
                            for (let y = 2011; y <= 2022; y++) {
                                document.write(`<option value="${y}">${y}</option>`);
                            }
                        </script>
                    </select>
                </div>
            </div>

            <!-- DISCIPLINE + DEPARTMENT -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                <div>
                    <label class="text-xs font-bold uppercase">Discipline</label>
                    <select id="discipline" required onchange="updateDepartments()"
                            class="w-full border px-4 py-2 rounded-lg">
                        <option value="">Select Discipline</option>
                        <option value="Diploma">Diploma</option>
                        <option value="BE">B.E / B.Tech</option>
                        <option value="ME">M.E / M.Tech</option>
                        <option value="BSc">B.Sc</option>
                        <option value="MSc">M.Sc</option>
                        <option value="PhD">PhD</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase">Department</label>
                    <select id="department" required disabled
                            class="w-full border px-4 py-2 rounded-lg">
                        <option value="">Select Department</option>
                    </select>
                </div>
            </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Mobile No</label>
                        <input type="tel" id="mobile" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none transition-colors" placeholder="9876543210">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
                        <input type="email" id="email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none transition-colors" placeholder="you@email.com">
                    </div>
                </div>

                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100 mb-6">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-semibold text-gray-700">Add Guests (Parents/Spouse)</span>
                        <select id="guestCount" onchange="calculateTotal()" class="border-gray-300 border rounded p-1 text-sm bg-white focus:ring-blue-500">
                            <option value="0">None (Only Me)</option>
                            <option value="1">1 Guest (+₹1)</option>
                            <option value="2">2 Guests (+₹2)</option>
                            <option value="3">3 Guests (+₹3)</option>
                            <option value="4">4 Guests (+₹4)</option>
                            <option value="5">5 Guests (+₹5)</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center border-t border-blue-200 pt-3">
                        <span class="text-gray-500 text-sm font-medium">Total Payable Amount</span>
                        <span class="text-2xl font-bold text-blue-700" id="totalPrice">₹1</span>
                    </div>
                </div>

                <button type="submit" id="payBtn" class="w-full razorpay-btn text-white font-bold py-3.5 rounded-lg shadow-lg flex justify-center items-center gap-2">
                    <span>Pay Securely with Razorpay</span>
                    <i class="fas fa-lock text-sm"></i>
                </button>
                
                <p id="statusMsg" class="text-center text-xs text-gray-500 mt-3 hidden"></p>
                <p class="text-center text-xs text-red-500 mt-1 font-bold">⚠️ LIVE MODE: You will be charged ₹1</p>
            </form>
        </div>
    </div>

<script>
function updateDepartments() {
    const discipline = document.getElementById("discipline").value;
    const dept = document.getElementById("department");
    dept.innerHTML = '<option value="">Select Department</option>';
    dept.disabled = false;

    const map = {
        Diploma: ["Computer Engineering","Mechanical Engineering","Electrical Engineering","Chemical Engineering", "Environmental Science & Technology"],
        BE: ["Computer Engineering","Mechanical Engineering","Electrical Engineering","Chemical Engineering","Environmental Science & Technology","Chemical Technology"],
        ME: ["Computer Engineering","Mechanical Engineering","Electrical Engineering","Chemical Engineering","Environmental Science & Technology"],
        BSc: ["Microbiology","Chemistry"],
        MSc: ["Microbiology","Chemistry"],
        PhD: ["Engineering","Science & Technology"]
    };

    (map[discipline] || []).forEach(d => {
        dept.innerHTML += `<option>${d}</option>`;
    });
}

</script>
    
    <script>
        // ==========================================
        // ⚠️ CONFIGURATION
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDO6ix9e--7JDFmMD0XhfEYwRVu2n5CTQ_8T9ce6RMRW1nONGVTGNq2CFyQqrtqSih0w/exec"; 
        const RAZORPAY_KEY_ID = "rzp_live_Rqn2ngShaRsf8X"; 
        // ==========================================

        // --- CHANGE FOR TEST MODE ---
        const pricePerPerson = 1; // 1 Rupee per person
        let currentTotal = 1;

        function calculateTotal() {
            const guests = parseInt(document.getElementById('guestCount').value);
            currentTotal = (1 + guests) * pricePerPerson;
            document.getElementById('totalPrice').innerText = "₹" + currentTotal;
        }

        function initiateRazorpay(e) {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            const msg = document.getElementById('statusMsg');
            
            const mobile = document.getElementById('mobile').value;
            if (mobile.length < 10) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = `<div class="loader"></div> Initializing...`;
            btn.disabled = true;

            var options = {
                "key": RAZORPAY_KEY_ID, 
                // CRITICAL FIX: Razorpay accepts amount in PAISE.
                // 1 Rupee = 100 Paise.
                // We MUST multiply by 100 here.
                "amount": currentTotal * 100, 
                "currency": "INR",
                "name": "UPL University",
                "description": "Alumni Meet 2025 Registration",
                "image": "https://i.ibb.co/2Yhfrk8H/UPL-LOGO.png",
                "handler": function (response){
                    sendDataToBackend(response.razorpay_payment_id, btn, originalText);
                },
                "prefill": {
                    "name": document.getElementById('name').value,
                    "email": document.getElementById('email').value,
                    "contact": mobile
                },
                "theme": {
                    "color": "#3399cc"
                },
                "modal": {
                    "ondismiss": function(){
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                }
            };

            var rzp1 = new Razorpay(options);
            
            rzp1.on('payment.failed', function (response){
                alert("Transaction Failed: " + response.error.description);
                btn.innerHTML = originalText;
                btn.disabled = false;
            });

            rzp1.open();
        }

        function sendDataToBackend(paymentId, btn, originalText) {
            btn.innerHTML = `<div class="loader"></div> Verifying & Saving...`;
            const msg = document.getElementById('statusMsg');
            msg.innerText = "Please wait, do not close this window.";
            msg.classList.remove('hidden');

            const formData = {
                payment_id: paymentId,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                mobile: document.getElementById('mobile').value,
                year: document.getElementById('year').value,
                discipline: document.getElementById('discipline').value,
                department: document.getElementById('department').value,
                guests: document.getElementById('guestCount').value,
                amount: currentTotal
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(formData)
            })
            .then(response => {
                alert(`✅ Registration Successful!\n\nTransaction ID: ${paymentId}\nA confirmation email has been sent to ${formData.email}.`);
                document.getElementById('regForm').reset();
                calculateTotal();
                btn.innerHTML = originalText;
                btn.disabled = false;
                msg.classList.add('hidden');
            })
            .catch(error => {
                console.log("Submission Note:", error);
                alert(`✅ Registration Complete!\n\nTransaction ID: ${paymentId}\nIf you don't receive an email in 5 minutes, please contact support.`);
                btn.innerHTML = originalText;
                btn.disabled = false;
                msg.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
