<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPL University Alumni Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Poppins', sans-serif;
            /* Background Image with Dark Overlay for readability */
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://i.ibb.co/q3G5k42g/Slider-133972189776778304.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.98); 
            border-radius: 16px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }

        /* Razorpay Brand Color Button */
        .razorpay-btn { background-color: #3399cc; transition: all 0.3s ease; }
        .razorpay-btn:hover { background-color: #267ba5; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .razorpay-btn:disabled { background-color: #94a3b8; cursor: not-allowed; transform: none; }

        /* Smooth Input Focus States */
        input:focus, select:focus { border-color: #3399cc; ring: 2px solid #3399cc; }
        
        /* Loader Animation */
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3399cc; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-5xl flex flex-col lg:flex-row overflow-hidden">
        
        <div class="w-full lg:w-4/12 bg-slate-900 text-white p-8 flex flex-col justify-between relative">
            <div class="relative z-10">
                <img src="https://i.ibb.co/2Yhfrk8H/UPL-LOGO.png" alt="UPL University Logo" class="h-16 w-auto mb-6 object-contain">
                <h3 class="text-xs font-bold tracking-widest uppercase text-blue-400">UPL University</h3>
                <h1 class="text-3xl font-bold mb-4">Alumni Meet 2025</h1>
                <p class="text-slate-300 text-sm">Join us for an evening of nostalgia and networking. "Your presence truly matters to us."</p>
            </div>
            
            <div class="space-y-5 mt-8 text-sm relative z-10">
                <div class="flex items-center space-x-3 group">
                    <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center text-blue-400"><i class="far fa-calendar-alt"></i></div>
                    <span class="text-slate-200">Jan 4, 2025 (Sunday)</span>
                </div>
                <div class="flex items-center space-x-3 group">
                    <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center text-blue-400"><i class="far fa-clock"></i></div>
                    <span class="text-slate-200">3:00 PM - 7:00 PM</span>
                </div>
                <div class="flex items-center space-x-3 group">
                    <div class="w-8 h-8 rounded bg-slate-800 flex items-center justify-center text-blue-400"><i class="fas fa-map-marker-alt"></i></div>
                    <span class="text-slate-200">UPL University Campus</span>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-700">
                <p class="text-xs text-slate-500">Secured by Razorpay</p>
            </div>
        </div>

        <div class="w-full lg:w-8/12 p-8 lg:p-10">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Registration Details</h2>
            
            <form id="regForm" onsubmit="initiateRazorpay(event)">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Full Name</label>
                        <input type="text" id="name" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none transition-colors" placeholder="Enter full name">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Passout Year</label>
                        <input type="number" id="year" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none transition-colors" placeholder="e.g. 2022">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Discipline</label>
                        <select id="discipline" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-white focus:outline-none transition-colors">
                            <option value="">Select Discipline</option>
                            <option value="Diploma">Diploma</option>
                            <option value="BE">B.E. / B.Tech</option>
                            <option value="ME">M.E. / M.Tech</option>
                            <option value="BSc">B.Sc</option>
                            <option value="MSc">M.Sc</option>
                            <option value="PhD">PhD</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Department</label>
                        <input type="text" id="department" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none transition-colors" placeholder="e.g. Computer Engineering">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Mobile No</label>
                        <input type="tel" id="mobile" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none transition-colors" placeholder="9876543210">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
                        <input type="email" id="email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none transition-colors" placeholder="you@email.com">
                    </div>
                </div>

                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100 mb-6">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-semibold text-gray-700">Add Guests (Parents/Spouse)</span>
                        <select id="guestCount" onchange="calculateTotal()" class="border-gray-300 border rounded p-1 text-sm bg-white focus:ring-blue-500">
                            <option value="0">None (Only Me)</option>
                            <option value="1">1 Guest (+₹100)</option>
                            <option value="2">2 Guests (+₹200)</option>
                            <option value="3">3 Guests (+₹300)</option>
                            <option value="4">4 Guests (+₹400)</option>
                            <option value="5">5 Guests (+₹500)</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center border-t border-blue-200 pt-3">
                        <span class="text-gray-500 text-sm font-medium">Total Payable Amount</span>
                        <span class="text-2xl font-bold text-blue-700" id="totalPrice">₹100</span>
                    </div>
                </div>

                <button type="submit" id="payBtn" class="w-full razorpay-btn text-white font-bold py-3.5 rounded-lg shadow-lg flex justify-center items-center gap-2">
                    <span>Pay Securely with Razorpay</span>
                    <i class="fas fa-lock text-sm"></i>
                </button>
                
                <p id="statusMsg" class="text-center text-xs text-gray-500 mt-3 hidden"></p>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ CONFIGURATION: ENTER YOUR KEYS HERE
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDO6ix9e--7JDFmMD0XhfEYwRVu2n5CTQ_8T9ce6RMRW1nONGVTGNq2CFyQqrtqSih0w/exec"; 
        const RAZORPAY_KEY_ID = "rzp_live_Rqn2ngShaRsf8X"; 
        // ==========================================

        const pricePerPerson = 1;
        let currentTotal = 1;

        // Dynamic Price Calculation
        function calculateTotal() {
            const guests = parseInt(document.getElementById('guestCount').value);
            currentTotal = (1 + guests) * pricePerPerson;
            document.getElementById('totalPrice').innerText = "₹" + currentTotal;
        }

        // Trigger Razorpay Payment
        function initiateRazorpay(e) {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            const msg = document.getElementById('statusMsg');
            
            // Validate Mobile Number (Simple Check)
            const mobile = document.getElementById('mobile').value;
            if (mobile.length < 10) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            // UI Feedback
            const originalText = btn.innerHTML;
            btn.innerHTML = `<div class="loader"></div> Initializing...`;
            btn.disabled = true;

            var options = {
                "key": RAZORPAY_KEY_ID, 
                "amount": currentTotal * 1, // Amount in paise
                "currency": "INR",
                "name": "UPL University",
                "description": "Alumni Meet 2025 Registration",
                "image": "https://i.ibb.co/2Yhfrk8H/UPL-LOGO.png",
                "handler": function (response){
                    // PAYMENT SUCCESSFUL - Send data to Google Script
                    sendDataToBackend(response.razorpay_payment_id, btn, originalText);
                },
                "prefill": {
                    "name": document.getElementById('name').value,
                    "email": document.getElementById('email').value,
                    "contact": mobile
                },
                "theme": {
                    "color": "#3399cc"
                },
                "modal": {
                    "ondismiss": function(){
                        // Reset button if user closes the popup
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                }
            };

            var rzp1 = new Razorpay(options);
            
            // Handle Payment Failure
            rzp1.on('payment.failed', function (response){
                alert("Transaction Failed: " + response.error.description);
                btn.innerHTML = originalText;
                btn.disabled = false;
            });

            rzp1.open();
        }

        // Send Data to Google Script (Backend)
        function sendDataToBackend(paymentId, btn, originalText) {
            btn.innerHTML = `<div class="loader"></div> Verifying & Saving...`;
            const msg = document.getElementById('statusMsg');
            msg.innerText = "Please wait, do not close this window.";
            msg.classList.remove('hidden');

            const formData = {
                payment_id: paymentId,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                mobile: document.getElementById('mobile').value,
                year: document.getElementById('year').value,
                discipline: document.getElementById('discipline').value,
                department: document.getElementById('department').value,
                guests: document.getElementById('guestCount').value,
                amount: currentTotal
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(formData)
            })
            .then(response => {
                // Success Flow
                alert(`✅ Registration Successful!\n\nTransaction ID: ${paymentId}\nA confirmation email has been sent to ${formData.email}.`);
                document.getElementById('regForm').reset();
                calculateTotal();
                
                // Reset UI
                btn.innerHTML = originalText;
                btn.disabled = false;
                msg.classList.add('hidden');
            })
            .catch(error => {
                // Network Error Handling (CORS often triggers this even on success)
                console.log("Submission Note:", error);
                alert(`✅ Registration Complete!\n\nTransaction ID: ${paymentId}\nIf you don't receive an email in 5 minutes, please contact support.`);
                
                // Reset UI
                btn.innerHTML = originalText;
                btn.disabled = false;
                msg.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
